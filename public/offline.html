<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>You're offline — Mail Automation</title>
    <!--
      Static offline fallback served by the service worker when a navigation
      cannot reach the server. Deliberately zero external assets and zero JS:
      it must render instantly from cache on any device, with no hydration.
    -->
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        background: #f8fafc;
        color: #1e293b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
      }
      h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
      p {
        max-width: 42ch;
        font-size: 14px;
        line-height: 1.6;
        color: #64748b;
      }
      .actions { margin-top: 8px; display: flex; gap: 10px; }
      a.button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #2563eb;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        padding: 10px 18px;
        border-radius: 12px;
        text-decoration: none;
      }
      a.button.secondary { background: #e2e8f0; color: #334155; }
      footer { margin-top: 24px; font-size: 11px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="34" height="34">
        <g transform="translate(24,28)" fill="#ffffff">
          <path
            d="M40 0 L0 20 L40 40 L80 20 Z M8 26 v14 c0 8 14.4 14 32 14 s32-6 32-14 V26 l-32 16 Z"
          />
        </g>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>
      This device has lost its connection. Mail Automation needs the internet to
      load your workspace — incoming mail processing continues on the server and
      will resume here once you're back online.
    </p>
    <div class="actions">
      <a class="button" href="/dashboard">Try again</a>
      <a class="button secondary" href="/" >Home</a>
    </div>
    <footer>IT Department — Mail Automation</footer>
  </body>
</html>
