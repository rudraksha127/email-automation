name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for an accurate secret scan

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No license key needed for public repos; private repos need GITLEAKS_LICENSE.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & API tests
        run: npm test
        env:
          # Tests own their temp databases; never touch a real one in CI.
          PILOT_DISABLE_POLLER: "true"

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true # report, don't block the pilot on advisory noise

      - name: Production build
        run: npm run build
