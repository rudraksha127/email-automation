name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Keep tests/builds hermetic — no background poller, fixture credentials only.
      PILOT_DISABLE_POLLER: "true"
      PILOT_ADMIN_EMAIL: ci@fixture.test
      PILOT_ADMIN_PASSWORD: ci-fixture-password-123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Secret scan (tracked files + env files must be untracked)
        run: |
          set -euo pipefail
          fail=0
          # 1) No credential material in tracked files.
          if git grep -nE -- \
            '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE)|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|sk_live_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}' \
            -- . ':(exclude).env.example'; then
            echo "::error::Potential secret found in tracked files"
            fail=1
          fi
          # 2) No .env files ever tracked (templates excepted).
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '^\.env\.example$'; then
            echo "::error::An environment file is tracked by git"
            fail=1
          fi
          # 3) No database/token artifacts tracked.
          if git ls-files | grep -E '\.(db|sqlite)(-wal|-shm)?$|oauth-tokens\.json|client_secret.*\.json$'; then
            echo "::error::Database or token artifact tracked by git"
            fail=1
          fi
          exit $fail

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Production dependency vulnerability audit
        # Dev-tooling advisories (eslint chain) are tracked separately; only
        # runtime dependencies gate the build.
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build
